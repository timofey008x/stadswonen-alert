name: Stadswonen check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stadswonen
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRICE: "500"
          WIJKEN: "centrum,kralingen"
          GENDER: "man"
        run: python scraper.py

      - name: Commit seen.json indien gewijzigd
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen.json"
            git pull --rebase origin main
            git push
          else
            echo "Geen wijzigingen in seen.json"
          fi

      - name: Upload debug HTML als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last_page-${{ github.run_id }}
          path: last_page.html
          if-no-files-found: ignore
          retention-days: 3
